# Tên của kịch bản
name: Auto-submit Google Form

# Lịch trình chạy
on:
  schedule:
    # CHỈNH SỬA DÒNG NÀY: Chạy sau mỗi 7 phút
    - cron: '* * * * *'
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  submit_form:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn về
      - name: Check out repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Bước 3: Cài đặt thư viện
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bước 4: Chạy script 1 LẦN DUY NHẤT mỗi khi được kích hoạt
      # GitHub sẽ lo việc lặp lại theo lịch trình
      - name: Run the script
        run: python main.py "${{ secrets.FORM_URL }}" -n 1
