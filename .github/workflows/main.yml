# Tên của kịch bản
name: Auto-submit Google Form

# Lịch trình chạy
on:
  schedule:
    # Chạy vào phút thứ 30 của mỗi giờ (ví dụ: 1:30, 2:30, 3:30...)
    # Bạn có thể thay đổi lịch trình tại crontab.guru
    - cron: '30 * * * *'
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  submit_form:
    runs-on: ubuntu-latest # Sử dụng máy ảo hệ điều hành Ubuntu

    steps:
      # Bước 1: Lấy mã nguồn từ repository về máy ảo
      - name: Check out repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Sử dụng Python phiên bản 3.10

      # Bước 3: Cài đặt các thư viện cần thiết từ tệp requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bước 4: Chạy script main.py
      # Nó sẽ tự động lấy URL từ Secret bạn đã tạo ở Bước 2
      # Nó sẽ chạy 1 lần mỗi khi lịch trình được kích hoạt
      - name: Run the script
        run: python main.py "${{ secrets.FORM_URL }}" -n 1
